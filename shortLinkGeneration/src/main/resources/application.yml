server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/short_url?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: # 本地密码配置在application-local.yml 文件中

  data:
    redis:
      host: localhost
      port: 6379
      database: 0

# 短链自定义配置
short:
  url:
    domain: http://localhost:8080/
    expire-days: 30
    code-length: 6

# MyBatis‑Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      # logic-delete-field: deleted
      # logic-delete-value: 1
      # logic-not-delete-value: 0

# Swagger接口文档
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs
    enabled: true
